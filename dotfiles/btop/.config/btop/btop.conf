#? Config file for btop v. 1.4.7

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" relative to binary or "$HOME/.config/btop/themes"
color_theme = "btop"

#* If the theme set background should be shown, set to False if you want terminal background
theme_background = True

#* Sets if 24-bit truecolor should be used, will convert 24-bit colors to 256 color (6x6x6 color cube) if false.
truecolor = True

#* Set to true to force tty mode.
tty_mode = False

#* Symbols for graphs: "braille" (dots for high resolution), "block" (solid blocks), or "tty".
graph_symbol = "braille"

#* Update time in milliseconds, recommended 2000 ms or above, minimum 100 ms.
update_ms = 2000

#* Set rounded corners to boxes
rounded_corners = True

#* Default mode to start in. "cpu", "mem", "net" or "proc"
shown_boxes = "proc cpu mem net"
