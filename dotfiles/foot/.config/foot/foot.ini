# Dynamic Theme Import
include=~/.local/state/hyprvibe/current/foot.ini

[main]
font=JetBrainsMono Nerd Font:size=12

[scrollback]
multiplier=3.0

[mouse-bindings]
scrollback-up-page=Alt+BTN_WHEEL_BACK
scrollback-down-page=Alt+BTN_WHEEL_FORWARD

[cursor]
blink=yes
blink-rate=500

[colors-dark]
alpha=0.85
blur=yes



