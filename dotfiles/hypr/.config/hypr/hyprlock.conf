# Fallback Theme Variables
$theme_bg = rgba(0, 0, 0, 1.0)
$theme_bg_alpha = rgba(50, 50, 50, 0.5)
$theme_fg = rgba(255, 255, 255, 1.0)
$theme_accent = rgba(255, 255, 255, 1.0)
$theme_selection = rgba(50, 50, 50, 1.0)
$theme_muted = rgba(255, 255, 255, 0.5)
$theme_muted_alpha = rgba(255, 255, 255, 0.5)
$theme_red = rgba(255, 0, 0, 1.0)
$theme_yellow = rgba(255, 255, 0, 1.0)
$theme_green = rgba(0, 255, 0, 1.0)
$theme_placeholder = ##ffffff99

# Dynamic Theme Import
source = ~/.local/state/hyprvibe/current/hyprlock.conf

# BACKGROUND
background {
    monitor =
    color = $theme_bg
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = $theme_fg
    font_size = 120
    font_family = JetBrains Mono Nerd Font
    position = 0, -560
    halign = center
    valign = top
}

# DAY-DATE-MONTH
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    color = $theme_accent
    font_size = 30
    font_family = JetBrains Mono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# SEPARATOR LINE
shape {
    monitor =
    size = 800, 2
    color = $theme_muted_alpha
    rounding = -1
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    rotate = 0
    xray = false
    position = 0, -10
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   Hello, $USER.
    color = $theme_fg
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 100
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $theme_accent
    inner_color = $theme_bg_alpha
    font_color = $theme_fg
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <span foreground="$theme_placeholder">enter the password</span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    check_color = $theme_yellow
    fail_color = $theme_red
}
